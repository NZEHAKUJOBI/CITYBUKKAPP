<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Chop City Bukka - Authentic Urban Bukka & African Fusion Food Delivery in Minna, Niger State.">

  <!-- PWA / installability -->
  <meta name="theme-color" content="#0C2619">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="City Bukka">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="City Bukka">
  <meta name="format-detection" content="telephone=no">

  <title>Chop City Bukka | Authentic Food Delivery Minna</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      background-color: #071910;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #FFFFFF;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
      animation: pulse 2s infinite ease-in-out;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #FFB300;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 179, 0, 0.2);
      border-top-color: #FFB300;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <img src="icons/Icon-192.png" alt="Chop City Bukka" class="logo-img">
    <div class="brand-title">Chop City <span>Bukka</span></div>
    <div class="spinner"></div>
  </div>
  <noscript>Chop City Bukka needs JavaScript enabled to run.</noscript>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline support: register our own service worker (web/sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (reg) {
          // Hand the worker everything this first visit already downloaded
          // (main.dart.js, CanvasKit, fonts…) so the next launch works offline.
          var warm = function () {
            if (!reg.active) return;
            var urls = performance.getEntriesByType('resource')
              .map(function (e) { return e.name; })
              .filter(function (u) { return u.indexOf(location.origin) === 0; });
            urls.push(location.href);
            reg.active.postMessage({ type: 'warm-cache', urls: urls });
          };
          warm();
          window.addEventListener('flutter-first-frame', warm, { once: true });
        }).catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
