# Chop City Bukka on Dokploy (or any Docker host): one container running the app and its
# bundled PostgreSQL server. Database files and uploaded images live in the "data" volume.
#
# Dokploy: Project → Create Service → Compose → this repo, Compose Path ./docker-compose.yml.
# Set the variables below in the service's Environment tab, then add a domain for the
# "app" service on port 8080. See DEPLOY-DOKPLOY.md.
#
# No ports are published: Dokploy's Traefik routes the domain to the container.
# For a plain local run, add   ports: ["8080:8080"]   under "app".

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s   # time for the app and PostgreSQL to shut down cleanly
    environment:
      NODE_ENV: production
      PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-citybukka}
      POSTGRES_DB: ${POSTGRES_DB:-citybukka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?set ADMIN_TOKEN_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    volumes:
      - data:/var/data   # /var/data/postgres (database) and /var/data/uploads (images)
    expose:
      - "8080"

volumes:
  data:
