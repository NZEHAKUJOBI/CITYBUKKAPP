<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Chop City Bukka - Authentic Urban Bukka & African Fusion Food Delivery in Minna, Niger State." />
    <meta name="theme-color" content="#0C2619" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="City Bukka" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>Chop City Bukka | Authentic Food Delivery Minna</title>
    <script>
      // Apply the saved theme before first paint (UserContext keeps it in sync afterwards).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('citybukka:profile') || 'null');
          if (p && typeof p.isDarkMode === 'boolean') {
            document.documentElement.dataset.theme = p.isDarkMode ? 'dark' : 'light';
          }
        } catch (e) { /* storage blocked – fall back to prefers-color-scheme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Chop City Bukka needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
